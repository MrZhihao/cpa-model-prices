name: Update merged model prices

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    paths:
      - custom_prices.json
      - scripts/merge.sh
      - .github/workflows/update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge upstream and custom prices
        run: scripts/merge.sh

      - name: Commit updated feed
        run: |
          if git diff --quiet -- model_prices.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_prices.json
          git commit -m "Update merged model prices ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
